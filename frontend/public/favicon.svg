<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Slate to Midnight Indigo -->
    <linearGradient id="synapt-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Trident / Synapse Gradient Flow -->
    <linearGradient id="synapt-flow" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter for Favicon Scale -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#synapt-bg)" />
  <rect width="61" height="61" x="1.5" y="1.5" rx="14.5" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Subtle Ambient Core Glow -->
  <circle cx="32" cy="32" r="18" fill="#4f46e5" fill-opacity="0.25" filter="url(#soft-glow)" />

  <!-- Synapt "S" Neural Supply Chain Track (Smooth Continuous Vector) -->
  <!-- Top loop: from (44, 20) sweeping left through (22, 22), down through center (32, 32) -->
  <!-- Bottom loop: from center (32, 32) sweeping right through (42, 42), down-left to (20, 44) -->
  <path
    d="M 44 20 C 44 20, 21 16, 21 27 C 21 34, 43 30, 43 37 C 43 48, 20 44, 20 44"
    stroke="url(#synapt-flow)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Trident Neural Links connecting the Graph -->
  <!-- Upward prong to top center node -->
  <line x1="32" y1="32" x2="32" y2="15" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.9" />
  <!-- Downward prong to bottom center node -->
  <line x1="32" y1="32" x2="32" y2="49" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Diagonal Trident Lateral Connectors -->
  <line x1="32" y1="32" x2="44" y2="20" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="32" y1="32" x2="20" y2="44" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- Supply Chain Knowledge Graph Nodes -->
  <!-- 1. Top Trident Anchor (Schema / Ontology Node) -->
  <circle cx="32" cy="15" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="32" cy="15" r="1.5" fill="#ffffff" />

  <!-- 2. Top-Right Inflow Node (Supplier Tier) -->
  <circle cx="44" cy="20" r="4" fill="#818cf8" stroke="#ffffff" stroke-width="1.5" />

  <!-- 3. Central Synapt Neural Nexus (Trident Core Engine) -->
  <circle cx="32" cy="32" r="6" fill="#4f46e5" stroke="#ffffff" stroke-width="2" filter="url(#soft-glow)" />
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" />

  <!-- 4. Bottom-Left Node (Logistics Corridor) -->
  <circle cx="20" cy="44" r="4" fill="#a855f7" stroke="#ffffff" stroke-width="1.5" />

  <!-- 5. Bottom Trident Anchor (Empirical Warehouse / Recovery Node) -->
  <circle cx="32" cy="49" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="32" cy="49" r="1.5" fill="#ffffff" />
</svg>